name: Music options

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r pipeline/requirements.txt
      - run: python pipeline/music_options.py
      - name: Publish as release "music-options"
        run: |
          gh release delete music-options --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create music-options build/music/*.mp3 \
            --title "Theme music options" --notes-file build/music/legend.txt --prerelease
