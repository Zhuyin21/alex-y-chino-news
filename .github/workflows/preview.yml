name: Preview (test MP3, not published to the feed)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to render"
        required: false
        default: "previews/sample.md"
      model:
        description: "TTS model override, e.g. gemini-3.8-flash-lite-tts (blank = the repo's TTS_MODEL)"
        required: false
        default: ""
      tag:
        description: "Release to publish to (use different tags to keep A/B results side by side)"
        required: false
        default: "preview"
      use_free:
        description: "Try the free key first (off for A/B tests, so both sides use the same tier)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"   # show progress live (and keep it if a job is cancelled)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_FREE: ${{ inputs.use_free && secrets.GEMINI_API_KEY_FREE || '' }}
      GH_TOKEN: ${{ github.token }}
      VOICE_ALEX: ${{ vars.VOICE_ALEX }}
      VOICE_CHINO: ${{ vars.VOICE_CHINO }}
      TTS_MODEL: ${{ inputs.model || vars.TTS_MODEL }}
      TTS_SERVICE_TIER: ${{ vars.TTS_SERVICE_TIER }}
      MUSIC_PACK: ${{ vars.MUSIC_PACK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r pipeline/requirements.txt
      - name: Render
        run: python pipeline/build_episode.py "${{ inputs.script }}" --out build
      - name: Publish as a prerelease (not in the feed)
        env:
          TAG: ${{ inputs.tag || 'preview' }}
          MODEL_USED: ${{ inputs.model || vars.TTS_MODEL || 'gemini-3.8-flash-tts' }}
        run: |
          stem=$(basename "${{ inputs.script }}" .md)
          python -c "import json,os;d=json.load(open('build/$stem.json'));print(f\"Model: {os.environ['MODEL_USED']}\nMusic pack: {d.get('music_pack')}\nVoices by source: {d.get('tts_usage')}\nLength: {d['duration_s']} s\")" > build/notes.txt
          cat build/notes.txt
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "build/$stem.mp3" --title "Preview: $TAG" --notes-file build/notes.txt --prerelease
