name: Theme music library

# Episodes pick a music pack AT RANDOM from assets/music/library every day (pipeline/build_episode.py),
# so this job just keeps the library growing:
#  - every Sunday at ~3:17 am MT: one new pack for the genre that has the fewest (~$0.04);
#  - run manually with "batch" to create packs for every genre that doesn't have one yet (~$0.04 each);
#  - or run manually with a genre to add one pack of that genre.
# Genres and prompts live in pipeline/music_pack.py (python pipeline/music_pack.py --list).

on:
  schedule:
    - cron: "17 10 * * 0"   # 10:17 UTC Sunday = 3:17 am MST
  workflow_dispatch:
    inputs:
      batch:
        description: "Create packs for up to N genres that have none yet (0 = off)"
        required: false
        default: "0"
      genre:
        description: "Or: one pack of this genre (blank = the genre with the fewest packs)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: music-weekly
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # Lyria has no free tier, so this uses the paid key
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r pipeline/requirements.txt
      - name: Generate
        run: |
          if [ "${{ inputs.batch }}" != "" ] && [ "${{ inputs.batch }}" != "0" ]; then
            python pipeline/music_pack.py --batch "${{ inputs.batch }}"
          elif [ -n "${{ inputs.genre }}" ]; then
            python pipeline/music_pack.py --genre "${{ inputs.genre }}" --no-activate
          else
            python pipeline/music_pack.py --grow
          fi
          python pipeline/music_pack.py --list
      - name: Commit to the library (also keeps what was made if the run fails halfway)
        if: always()
        run: |
          git config user.name "alex-y-chino-bot"
          git config user.email "actions@github.com"
          git add assets/music/
          git diff --cached --quiet && exit 0
          git commit -m "Music library: $(git diff --cached --name-only | grep pack.json | sed 's#.*/library/##; s#/pack.json##' | tr '\n' ' ')"
          git pull --rebase -q origin main
          git push
