name: Casting (new characters)

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "CHARACTER:Voice list, comma-separated (blank = 4 voices each for Ashley and Sophie)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      CASTING: ${{ inputs.candidates }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r pipeline/requirements.txt
      - run: pip install -q numpy && python pipeline/sfx.py futbol
      - name: Publish as release "sfx-test" (not in the feed)
        run: |
          gh release delete sfx-test --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create sfx-test build/sfx/*.mp3 build/sfx/*_voces_crudas.wav --title "SFX test" --notes "Sports transition test" --prerelease --target sfx-test
